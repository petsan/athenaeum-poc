[project]
name = "athenaeum-body"
version = "0.1.0"
description = "Proof-of-work slice of the Athenaeum Body: storage integrity, checkpoint/resume, and time-sliced concurrency."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
